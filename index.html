<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>阿鹿鹿接接樂</title>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root{
      --bg1:#ffd6e7;
      --bg2:#fff4f9;
      --card:#ffffffcc;
      --text:#111;
    }
    html,body{
      height:100%;
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      background: linear-gradient(180deg,var(--bg1),var(--bg2));
      overflow:hidden;
      touch-action:none;
    }

    #game{
      position:relative;
      width:100vw;
      height:100vh;
      overflow:hidden;
    }

    /* HUD */
    #hud{
      position:absolute;
      top:14px; left:14px; right:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      z-index:10;
      pointer-events:none;
      flex-wrap:wrap;
    }

    .pill{
      pointer-events:auto;
      background:var(--card);
      border-radius:18px;
      padding:10px 14px;
      font-weight:800;
      box-shadow:0 10px 30px rgba(0,0,0,.10);
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--text);
      user-select:none;
      -webkit-user-select:none;
    }

    .pill.small{
      font-weight:700;
      padding:10px 12px;
    }

    #titlePill{
      max-width:46vw;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    #welcomePill{
      flex:1;
      justify-content:flex-start;
      max-width:48vw;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-weight:800;
    }

    #btnRestartTop{
      pointer-events:auto;
      border:none;
      background:#fff;
      border-radius:18px;
      padding:10px 14px;
      font-weight:800;
      box-shadow:0 10px 30px rgba(0,0,0,.10);
      cursor:pointer;
    }

    /* Audio controls */
    #audioPill{
      pointer-events:auto;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      padding:10px 12px;
    }
    .toggleBtn{
      border:none;
      border-radius:14px;
      padding:8px 10px;
      font-weight:900;
      cursor:pointer;
      background:#fff;
      box-shadow:0 10px 30px rgba(0,0,0,.10);
    }
    .rangeWrap{
      display:flex;
      align-items:center;
      gap:8px;
      font-weight:800;
      font-size:13px;
      opacity:.95;
    }
    input[type="range"]{
      width:110px;
      accent-color:#111;
    }

    /* Player */
    #player{
      position:absolute;
      bottom:22px;
      left:50%;
      transform:translateX(-50%);
      width:78px;
      height:78px;
      border-radius:20px;
      background:rgba(255,255,255,.88);
      box-shadow:0 10px 30px rgba(0,0,0,.12);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:46px;
      user-select:none;
      -webkit-user-select:none;
      z-index:3;
      will-change:transform;
    }

    /* Q彈（縮放彈跳） */
    @keyframes squishPop{
      0%   { transform: scale(1); }
      18%  { transform: scale(1.12, .88); }
      45%  { transform: scale(.92, 1.10); }
      70%  { transform: scale(1.06, .96); }
      100% { transform: scale(1); }
    }
    .squish{ animation:squishPop 220ms cubic-bezier(.2,.9,.2,1); }

    /* Falling items */
    .item{
      position:absolute;
      width:54px;
      height:54px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:38px;
      user-select:none;
      -webkit-user-select:none;
      filter:drop-shadow(0 10px 12px rgba(0,0,0,.12));
      will-change:transform;
      z-index:2;
    }

    /* Sparks */
    .spark{
      position:absolute;
      width:22px;
      height:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      pointer-events:none;
      user-select:none;
      -webkit-user-select:none;
      filter:drop-shadow(0 10px 12px rgba(0,0,0,.12));
      will-change:transform, opacity;
      z-index:4;
    }

    /* Ground */
    #ground{
      position:absolute;
      bottom:0; left:0; right:0;
      height:18px;
      background:rgba(0,0,0,.05);
      z-index:1;
    }

    /* GameOver overlay */
    #gameover{
      display:none;
      position:absolute;
      inset:0;
      background:rgba(255,255,255,.82);
      z-index:999;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    #gameoverCard{
      width:min(520px, 92vw);
      background:#fff;
      border-radius:24px;
      padding:18px;
      box-shadow:0 18px 50px rgba(0,0,0,.16);
      display:flex;
      flex-direction:column;
      gap:10px;
      text-align:center;
    }
    #gameoverTitle{ font-size:28px; font-weight:900; }
    #finalScore{ font-size:20px; font-weight:800; }

    .btn{
      border:none;
      border-radius:18px;
      padding:12px 14px;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
    }
    .btn.primary{ background:#111; color:#fff; }
    .btn.secondary{ background:#fff; border:1px solid #ddd; color:#111; }

    #shareHint{
      font-size:12px;
      opacity:.75;
      margin-top:2px;
      word-break:break-word;
    }

    /* Leaderboard */
    #lb{
      margin-top:10px;
      text-align:left;
      background:#fafafa;
      border-radius:18px;
      padding:12px;
      border:1px solid #eee;
    }
    #lbTitle{ font-weight:900; margin-bottom:8px; }
    .lbRow{
      display:flex;
      justify-content:space-between;
      padding:6px 8px;
      border-radius:12px;
      background:#fff;
      border:1px solid #f0f0f0;
      margin-bottom:6px;
      font-weight:700;
      font-size:14px;
    }
    .muted{ opacity:.7; font-size:12px; margin-top:4px; }
  </style>
</head>

<body>
  <div id="game">
    <div id="hud">
      <div class="pill" id="titlePill">🦒 阿鹿鹿接接樂</div>
      <div class="pill" id="welcomePill">鹿粉你好～準備接接樂！</div>

      <div class="pill small" id="scorePill">分數：<span id="score">0</span></div>
      <div class="pill small" id="lifePill">命：<span id="lives">3</span> ❤️</div>

      <!-- 音效 / BGM -->
      <div class="pill small" id="audioPill" title="音效/音樂設定">
        <button class="toggleBtn" id="btnBgmToggle">🎵 BGM：開</button>
        <button class="toggleBtn" id="btnSfxToggle">🫧 音效：開</button>
        <div class="rangeWrap">BGM
          <input id="bgmVol" type="range" min="0" max="100" value="22" />
        </div>
        <div class="rangeWrap">SFX
          <input id="sfxVol" type="range" min="0" max="100" value="35" />
        </div>
      </div>

      <button id="btnRestartTop" title="重新開始">重新開始</button>
    </div>

    <div id="player" aria-label="player">🦒</div>
    <div id="ground"></div>

    <!-- Game Over -->
    <div id="gameover">
      <div id="gameoverCard">
        <div id="gameoverTitle">Game Over</div>
        <div id="finalScore">分數：0</div>

        <button class="btn primary" id="btnShare">分享成績到 LINE</button>
        <button class="btn secondary" id="btnRestart">重新開始</button>
        <div id="shareHint"></div>

        <div id="lb">
          <div id="lbTitle">🏆 排行榜（本機）</div>
          <div id="lbList"></div>
          <div class="muted">※ 目前為同裝置/同瀏覽器保存。要全體排行榜需後端（之後要我也可以幫你加）。</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**********************
     *  設定：LIFF ID
     **********************/
    const LIFF_ID = "2008833499-jzAWlBAJ";

    /**********************
     *  DOM
     **********************/
    const game = document.getElementById("game");
    const playerEl = document.getElementById("player");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const welcomePill = document.getElementById("welcomePill");

    const overlay = document.getElementById("gameover");
    const finalScoreEl = document.getElementById("finalScore");
    const shareHintEl = document.getElementById("shareHint");

    const btnRestartTop = document.getElementById("btnRestartTop");
    const btnRestart = document.getElementById("btnRestart");
    const btnShare = document.getElementById("btnShare");

    // 音效UI
    const btnBgmToggle = document.getElementById("btnBgmToggle");
    const btnSfxToggle = document.getElementById("btnSfxToggle");
    const bgmVolEl = document.getElementById("bgmVol");
    const sfxVolEl = document.getElementById("sfxVol");

    /**********************
     *  遊戲狀態
     **********************/
    let vw = window.innerWidth;
    let vh = window.innerHeight;

    let playerX = vw * 0.5;
    const playerW = 78;
    const playerH = 78;
    const itemW = 54;
    const itemH = 54;

    let score = 0;
    let lives = 3;

    let running = true;
    let lastSpawn = 0;
    let spawnInterval = 900;
    let speedBase = 220;
    const items = [];

    let playerName = "鹿粉";
    let inLIFF = false;

    // combo：影響泡泡音高
    let combo = 0;
    let lastGoodTs = 0;

    // Q彈：水平微抖（疊在 translateX）
    let shakeT = 0;
    let shakeAmp = 0;

    // 粒子
    const sparks = [];

    /**********************
     *  工具
     **********************/
    function rand(min, max){ return Math.random() * (max - min) + min; }
    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

    /**********************
     *  WebAudio：音效 + 輕快休閒BGM（合成）
     **********************/
    let audioCtx = null;
    const audioState = {
      sfxOn: true,
      bgmOn: true,
      sfxVol: 0.35,
      bgmVol: 0.22,
      sfxGain: null,
      bgmGain: null,
      bgmPlaying: false,
      bgmTimer: null,
      bgmStep: 0
    };

    function ensureAudio(){
      if(audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      audioState.sfxGain = audioCtx.createGain();
      audioState.bgmGain = audioCtx.createGain();

      audioState.sfxGain.gain.value = audioState.sfxOn ? audioState.sfxVol : 0;
      audioState.bgmGain.gain.value = audioState.bgmOn ? audioState.bgmVol : 0;

      audioState.sfxGain.connect(audioCtx.destination);
      audioState.bgmGain.connect(audioCtx.destination);
    }
    function setSfxGain(){
      if(!audioCtx) return;
      audioState.sfxGain.gain.value = audioState.sfxOn ? audioState.sfxVol : 0;
    }
    function setBgmGain(){
      if(!audioCtx) return;
      audioState.bgmGain.gain.value = audioState.bgmOn ? audioState.bgmVol : 0;
    }

    // 泡泡「啵」
    function playPop(baseFreq){
      if(!audioState.sfxOn) return;
      ensureAudio();
      if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});

      const t = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sine";
      const f0 = clamp(baseFreq, 220, 1200);
      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(f0 * 1.35, t + 0.03);
      osc.frequency.exponentialRampToValueAtTime(Math.max(120, f0 * 0.75), t + 0.12);

      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.55, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);

      osc.connect(gain);
      gain.connect(audioState.sfxGain);

      osc.start(t);
      osc.stop(t + 0.18);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = "triangle";
      osc2.frequency.setValueAtTime(f0 * 0.5, t + 0.02);
      gain2.gain.setValueAtTime(0.0001, t + 0.02);
      gain2.gain.exponentialRampToValueAtTime(0.35, t + 0.03);
      gain2.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      osc2.connect(gain2);
      gain2.connect(audioState.sfxGain);
      osc2.start(t + 0.02);
      osc2.stop(t + 0.14);
    }

    // 失誤音「噗」
    function playThunk(){
      if(!audioState.sfxOn) return;
      ensureAudio();
      if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});

      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "square";
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(120, t + 0.08);

      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.40, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.10);

      osc.connect(gain);
      gain.connect(audioState.sfxGain);

      osc.start(t);
      osc.stop(t + 0.12);
    }

    // 輕快休閒BGM（節奏感更明顯但不吵）
    const bgm = {
      bpm: 128,
      melody: [64, 67, 69, 71, 72, 71, 69, 67, 64, 67, 72, 74, 72, 71, 69, 67],
      bass:   [48, 48, 48, 48, 43, 43, 43, 43, 45, 45, 45, 45, 41, 41, 41, 41],
      chord:  [60, 67, 69, 65] // C, G, Am, F
    };

    function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }

    function playNote(freq, dur, type, toGain, startAt, peak=0.50){
      const t0 = startAt ?? audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);

      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      osc.connect(g);
      g.connect(toGain);

      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }

    function scheduleBgmStep(){
      if(!audioState.bgmOn) return;
      ensureAudio();
      if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});

      const stepDur = 60 / bgm.bpm / 2; // 8分音符
      const step = audioState.bgmStep % 16;
      const now = audioCtx.currentTime;
      const startAt = now + 0.005;

      // 旋律（峰值較低避免吵）
      playNote(midiToFreq(bgm.melody[step]), stepDur * 0.85, "sine", audioState.bgmGain, startAt, 0.42);

      // 低音：節拍走路感
      playNote(midiToFreq(bgm.bass[step]), stepDur * 0.55, "triangle", audioState.bgmGain, startAt, 0.36);

      // 輕拍點綴
      if(step % 2 === 0){
        playNote(1800, stepDur * 0.18, "square", audioState.bgmGain, startAt + 0.002, 0.12);
      }

      // 和弦墊底
      if(step % 4 === 0){
        const root = bgm.chord[(step/4) % 4];
        [root, root+4, root+7].forEach((mm, idx)=>{
          playNote(midiToFreq(mm), stepDur * 1.35, "sine", audioState.bgmGain, startAt + idx*0.008, 0.26);
        });
      }

      audioState.bgmStep++;
      audioState.bgmTimer = setTimeout(scheduleBgmStep, stepDur * 1000);
    }

    function startBgm(){
      if(audioState.bgmPlaying) return;
      audioState.bgmPlaying = true;
      audioState.bgmStep = 0;
      scheduleBgmStep();
    }
    function stopBgm(){
      audioState.bgmPlaying = false;
      if(audioState.bgmTimer){
        clearTimeout(audioState.bgmTimer);
        audioState.bgmTimer = null;
      }
    }

    /**********************
     *  物品：💎 / 🍎
     **********************/
    function spawnItem(){
      const el = document.createElement("div");
      el.className = "item";

      const good = Math.random() < 0.55;
      el.textContent = good ? "💎" : "🍎";

      const x = rand(12, vw - itemW - 12);
      const y = -60;

      el.style.transform = `translate(${x}px, ${y}px)`;
      game.appendChild(el);

      const speed = speedBase + rand(-30, 90);
      items.push({ el, x, y, speed, good });
    }

    /**********************
     *  碰撞
     **********************/
    function intersects(ax, ay, aw, ah, bx, by, bw, bh){
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    /**********************
     *  HUD 更新
     **********************/
    function updateHUD(){
      scoreEl.textContent = String(score);
      livesEl.textContent = String(lives);
    }

    /**********************
     *  排行榜（本機 localStorage）
     **********************/
    const LB_KEY = "alulu_catch_lb_v1";

    function loadLeaderboard(){
      try{
        const raw = localStorage.getItem(LB_KEY);
        return raw ? JSON.parse(raw) : [];
      }catch(e){
        return [];
      }
    }
    function saveLeaderboard(list){
      localStorage.setItem(LB_KEY, JSON.stringify(list));
    }
    function addToLeaderboard(name, score){
      const list = loadLeaderboard();
      list.push({ name, score, ts: Date.now() });
      list.sort((a,b)=> b.score - a.score);
      const top = list.slice(0, 10);
      saveLeaderboard(top);
      return top;
    }
    function renderLeaderboard(list){
      const box = document.getElementById("lbList");
      box.innerHTML = "";
      if(!list.length){
        box.innerHTML = `<div class="muted">還沒有紀錄，快當第一名！</div>`;
        return;
      }
      list.forEach((r, i)=>{
        const row = document.createElement("div");
        row.className = "lbRow";
        row.innerHTML = `<div>${i+1}. ${escapeHtml(r.name || "鹿粉")}</div><div>${r.score}</div>`;
        box.appendChild(row);
      });
    }
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
      }[m]));
    }

    /**********************
     *  LIFF 初始化（抓名字）
     **********************/
    async function initLIFF(){
      try{
        await liff.init({ liffId: LIFF_ID });
        inLIFF = true;

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        try{
          const profile = await liff.getProfile();
          if(profile && profile.displayName){
            playerName = profile.displayName;
            welcomePill.textContent = `鹿粉 ${playerName}～準備接接樂！`;
          }
        }catch(e){
          welcomePill.textContent = "鹿粉你好～準備接接樂！";
        }
      }catch(e){
        inLIFF = false;
        welcomePill.textContent = "鹿粉你好～準備接接樂！";
      }
    }

    /**********************
     *  分享成績
     **********************/
    function buildShareText(score){
      return `🦒 阿鹿鹿接接樂 成績出爐！\n鹿粉：${playerName}\n分數：${score}\n你也來挑戰看看～`;
    }
    async function shareScore(score){
      const text = buildShareText(score);

      if(!inLIFF || !window.liff || !liff.isInClient || !liff.isInClient()){
        try{
          await navigator.clipboard.writeText(text);
          shareHintEl.textContent = "已複製分享文字～貼到 LINE/社群就可以！";
        }catch(e){
          shareHintEl.textContent = text;
        }
        return;
      }

      try{
        await liff.sendMessages([{ type:"text", text }]);
        shareHintEl.textContent = "已送出到聊天室～✅";
      }catch(e){
        shareHintEl.textContent = "分享失敗：可能尚未開啟 chat_message.write 權限，或不是在 LINE 內開啟。";
      }
    }

    /**********************
     *  玩家控制：拖曳 / 觸控
     **********************/
    let dragging = false;
    let dragOffsetX = 0;

    // 用 CSS 變數存基準 translateX，方便疊加 shake
    function setPlayerX(x){
      playerX = clamp(x, playerW/2 + 6, vw - playerW/2 - 6);
      playerEl.style.setProperty("--px", `${playerX - vw/2}px`);
      applyPlayerTransform(0);
    }
    function applyPlayerTransform(extraX){
      const base = playerEl.style.getPropertyValue("--px") || "0px";
      playerEl.style.transform = `translateX(calc(${base} + ${extraX}px))`;
    }

    function pointerDown(e){
      // 首次互動：啟用音訊 + 開始BGM（iOS限制）
      ensureAudio();
      if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
      if(audioState.bgmOn) startBgm();

      dragging = true;
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      dragOffsetX = cx - playerX;
    }
    function pointerMove(e){
      if(!dragging) return;
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      setPlayerX(cx - dragOffsetX);
    }
    function pointerUp(){ dragging = false; }

    game.addEventListener("mousedown", pointerDown, {passive:false});
    window.addEventListener("mousemove", pointerMove, {passive:false});
    window.addEventListener("mouseup", pointerUp, {passive:false});

    game.addEventListener("touchstart", pointerDown, {passive:false});
    window.addEventListener("touchmove", pointerMove, {passive:false});
    window.addEventListener("touchend", pointerUp, {passive:false});
    window.addEventListener("touchcancel", pointerUp, {passive:false});

    /**********************
     *  Q彈特效：彈一下 + 震動 + 星星粒子
     **********************/
    function squish(){
      playerEl.classList.remove("squish");
      void playerEl.offsetWidth; // 觸發 reflow
      playerEl.classList.add("squish");
    }
    function shake(strength=8){
      shakeT = 0.16;
      shakeAmp = Math.max(shakeAmp, strength);
    }
    function spawnSparks(cx, cy){
      const count = 7;
      const glyphs = ["✨","⭐️","💫"];
      for(let i=0;i<count;i++){
        const el = document.createElement("div");
        el.className = "spark";
        el.textContent = glyphs[Math.floor(rand(0, glyphs.length))];

        const ang = rand(-Math.PI*0.95, -Math.PI*0.05);
        const spd = rand(140, 320);
        const vx = Math.cos(ang) * spd;
        const vy = Math.sin(ang) * spd;

        const rot = rand(-180, 180);
        const vr = rand(-420, 420);

        const x = cx + rand(-10, 10);
        const y = cy + rand(-8, 8);

        el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
        game.appendChild(el);

        sparks.push({ el, x, y, vx, vy, life: rand(0.45, 0.75), rot, vr, opacity: 1 });
      }
    }
    function updateSparks(dt){
      for(let i=sparks.length-1;i>=0;i--){
        const p = sparks[i];
        p.life -= dt;
        if(p.life <= 0){
          if(p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);
          sparks.splice(i,1);
          continue;
        }
        p.vy += 760 * dt;
        p.vx *= (1 - 0.6*dt);
        p.vy *= (1 - 0.2*dt);

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;

        p.opacity = Math.max(0, p.life / 0.75);
        p.el.style.opacity = String(p.opacity);
        p.el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${p.rot}deg) scale(${0.9 + (1-p.opacity)*0.2})`;
      }
    }

    /**********************
     *  音效UI
     **********************/
    function refreshAudioUi(){
      btnBgmToggle.textContent = audioState.bgmOn ? "🎵 BGM：開" : "🎵 BGM：關";
      btnSfxToggle.textContent = audioState.sfxOn ? "🫧 音效：開" : "🫧 音效：關";
    }

    btnBgmToggle.addEventListener("click", ()=>{
      audioState.bgmOn = !audioState.bgmOn;
      ensureAudio();
      setBgmGain();
      if(audioState.bgmOn) startBgm();
      else stopBgm();
      refreshAudioUi();
    });

    btnSfxToggle.addEventListener("click", ()=>{
      audioState.sfxOn = !audioState.sfxOn;
      ensureAudio();
      setSfxGain();
      refreshAudioUi();
      if(audioState.sfxOn) playPop(420);
    });

    bgmVolEl.addEventListener("input", ()=>{
      audioState.bgmVol = Number(bgmVolEl.value) / 100;
      ensureAudio();
      setBgmGain();
    });
    sfxVolEl.addEventListener("input", ()=>{
      audioState.sfxVol = Number(sfxVolEl.value) / 100;
      ensureAudio();
      setSfxGain();
    });

    /**********************
     *  遊戲流程
     **********************/
    function removeItem(i){
      const it = items[i];
      if(it && it.el && it.el.parentNode) it.el.parentNode.removeChild(it.el);
      items.splice(i,1);
    }

    function gameOver(){
      running = false;
      playThunk();

      finalScoreEl.textContent = `分數：${score}`;
      shareHintEl.textContent = "";

      const list = addToLeaderboard(playerName, score);
      renderLeaderboard(list);

      overlay.style.display = "flex";
    }

    function resetGame(){
      for(let i=items.length-1;i>=0;i--) removeItem(i);

      score = 0;
      lives = 3;
      combo = 0;
      lastGoodTs = 0;

      shakeT = 0;
      shakeAmp = 0;

      // 清粒子
      for(let i=sparks.length-1;i>=0;i--){
        const p = sparks[i];
        if(p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);
        sparks.splice(i,1);
      }

      spawnInterval = 900;
      speedBase = 220;

      running = true;
      lastSpawn = 0;

      overlay.style.display = "none";
      updateHUD();

      vw = window.innerWidth;
      vh = window.innerHeight;
      setPlayerX(vw * 0.5);
    }

    function onGoodCatch(px, py){
      const now = performance.now();
      if(now - lastGoodTs < 1100) combo += 1;
      else combo = 1;
      lastGoodTs = now;

      // 連擊越高音高越高（限制上限避免刺耳）
      const freq = 360 + Math.min(18, combo) * 28;
      playPop(freq);

      // Q彈 + 星星
      squish();
      shake(7 + Math.min(6, combo));
      spawnSparks(px + playerW/2, py + 18);
    }

    function onBadEvent(){
      combo = 0;
      playThunk();
      shake(6);
    }

    function tick(ts){
      if(!tick.last) tick.last = ts;
      const dt = (ts - tick.last) / 1000;
      tick.last = ts;

      // 震動（疊在 translateX）
      if(shakeT > 0){
        shakeT -= dt;
        const phase = (shakeT * 55);
        const off = Math.sin(phase) * shakeAmp * (shakeT / 0.16);
        applyPlayerTransform(off);
      }else{
        if(shakeAmp !== 0){
          shakeAmp = 0;
          applyPlayerTransform(0);
        }
      }

      // 粒子
      updateSparks(dt);

      if(running){
        // 生成物品
        if(ts - lastSpawn > spawnInterval){
          spawnItem();
          lastSpawn = ts;

          // 逐漸加速
          spawnInterval = Math.max(380, spawnInterval - 10);
          speedBase = Math.min(520, speedBase + 2.2);
        }

        // 玩家左上角座標（碰撞）
        const px = playerX - playerW/2;
        const py = vh - 22 - playerH;

        // 更新物品
        for(let i=items.length-1;i>=0;i--){
          const it = items[i];
          it.y += it.speed * dt;

          // 掉地：扣命
          if(it.y > vh - 18 - itemH/2){
            lives -= 1;
            updateHUD();
            removeItem(i);
            onBadEvent();
            if(lives <= 0){
              gameOver();
              break;
            }
            continue;
          }

          // 碰撞
          if(intersects(px, py, playerW, playerH, it.x, it.y, itemW, itemH)){
            if(it.good){
              score += 10;
              onGoodCatch(px, py);
            }else{
              score = Math.max(0, score - 8);
              lives -= 1;
              onBadEvent();
            }
            updateHUD();
            removeItem(i);

            if(lives <= 0){
              gameOver();
              break;
            }
            continue;
          }

          it.el.style.transform = `translate(${it.x}px, ${it.y}px)`;
        }
      }

      requestAnimationFrame(tick);
    }

    /**********************
     *  按鈕
     **********************/
    btnRestartTop.addEventListener("click", resetGame);
    btnRestart.addEventListener("click", resetGame);
    btnShare.addEventListener("click", ()=> shareScore(score));

    /**********************
     *  Resize
     **********************/
    window.addEventListener("resize", ()=>{
      vw = window.innerWidth;
      vh = window.innerHeight;
      setPlayerX(playerX);
    });

    /**********************
     *  Init
     **********************/
    (async function boot(){
      renderLeaderboard(loadLeaderboard());
      setPlayerX(playerX);
      initLIFF();
      updateHUD();
      refreshAudioUi();

      // iOS/Safari：BGM 會在第一次觸控/拖曳時開始（pointerDown）
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
