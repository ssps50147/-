<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>阿鹿鹿接接樂</title>

  <!-- LIFF SDK（保留：抓名字用；已移除分享功能） -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- 結算卡截圖工具 -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    :root{
      --bg1:#ffd6e7;
      --bg2:#fff4f9;
      --card:#ffffffcc;
      --text:#111;
      --themeGlow: rgba(255,120,190,.65);

      --vh: 1vh;
      --safeB: env(safe-area-inset-bottom);
      --safeT: env(safe-area-inset-top);
    }

    html,body{
      height:100%;
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Arial, sans-serif;
      background: linear-gradient(180deg,var(--bg1),var(--bg2));
      overflow:hidden;
      touch-action:none;
    }

    /* ✅ 可視高度（避免 iPhone/LINE 底部工具列遮住） */
    #game{
      position:relative;
      width:100vw;
      height: calc(var(--vh) * 100);
      height: 100dvh;
      height: 100svh;
      overflow:hidden;
      padding-bottom: var(--safeB);
      box-sizing:border-box;
    }

    /* HUD */
    #hud{
      position:absolute;
      top: calc(14px + var(--safeT));
      left:14px;
      right:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      z-index:10;
      pointer-events:none;
      flex-wrap:wrap;
    }
    .pill{
      pointer-events:auto;
      background:var(--card);
      border-radius:18px;
      padding:10px 14px;
      font-weight:800;
      box-shadow:0 10px 30px rgba(0,0,0,.10);
      display:flex;
      align-items:center;
      gap:8px;
      color:var(--text);
      user-select:none;
      -webkit-user-select:none;
    }
    .pill.small{ font-weight:700; padding:10px 12px; }

    #titlePill{
      max-width:46vw;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    #welcomePill{
      flex:1;
      justify-content:flex-start;
      max-width:48vw;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-weight:800;
    }

    #btnRestartTop{
      pointer-events:auto;
      border:none;
      background:#fff;
      border-radius:18px;
      padding:10px 14px;
      font-weight:800;
      box-shadow:0 10px 30px rgba(0,0,0,.10);
      cursor:pointer;
    }

    /* Audio controls */
    #audioPill{
      pointer-events:auto;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      padding:10px 12px;
    }
    .toggleBtn{
      border:none;
      border-radius:14px;
      padding:8px 10px;
      font-weight:900;
      cursor:pointer;
      background:#fff;
      box-shadow:0 10px 30px rgba(0,0,0,.10);
    }
    .rangeWrap{
      display:flex;
      align-items:center;
      gap:8px;
      font-weight:800;
      font-size:13px;
      opacity:.95;
    }
    input[type="range"]{ width:110px; accent-color:#111; }

    #stagePill{ pointer-events:auto; font-weight:900; }

    /* Player */
    #player{
      position:absolute;
      bottom: calc(22px + var(--safeB));
      left:50%;
      transform:translateX(-50%);
      width:78px;
      height:78px;
      border-radius:20px;
      background:rgba(255,255,255,.88);
      box-shadow:0 10px 30px rgba(0,0,0,.12);
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      -webkit-user-select:none;
      z-index:3;
      will-change:transform;
    }
    #playerAvatar{
      width:66px;
      height:66px;
      object-fit:contain;
      user-select:none;
      -webkit-user-select:none;
      pointer-events:none;
    }

    /* Falling items */
    .item{
      position:absolute;
      width:54px;
      height:54px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:38px;
      user-select:none;
      -webkit-user-select:none;
      filter:drop-shadow(0 10px 12px rgba(0,0,0,.12));
      will-change:transform;
      z-index:2;
    }

    /* 水果主題光暈 */
    .item.fruit{
      border-radius:16px;
      background: rgba(255,255,255,.10);
      outline: 2px solid rgba(255,255,255,.18);
    }
    .item.fruit::after{
      content:"";
      position:absolute;
      inset:-8px;
      border-radius:18px;
      background: radial-gradient(circle at 50% 45%,
        var(--themeGlow, rgba(255,180,220,.55)) 0%,
        rgba(255,255,255,0) 70%);
      filter: blur(1px);
      opacity:.95;
      pointer-events:none;
    }

    /* Particles */
    .spark{
      position:absolute;
      width:22px;
      height:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      pointer-events:none;
      user-select:none;
      -webkit-user-select:none;
      filter:drop-shadow(0 10px 12px rgba(0,0,0,.12));
      will-change:transform, opacity;
      z-index:4;
    }

    /* Ground */
    #ground{
      position:absolute;
      left:0; right:0;
      bottom: var(--safeB);
      height:18px;
      background:rgba(0,0,0,.05);
      z-index:1;
    }

    /* GameOver overlay */
    #gameover{
      display:none;
      position:absolute;
      inset:0;
      background:rgba(255,255,255,.82);
      z-index:999;
      align-items:center;
      justify-content:center;
      padding: calc(18px + var(--safeT)) 18px calc(18px + var(--safeB));
      box-sizing:border-box;
    }
    #gameoverCard{
      width:min(520px, 92vw);
      background:#fff;
      border-radius:24px;
      padding:18px;
      box-shadow:0 18px 50px rgba(0,0,0,.16);
      display:flex;
      flex-direction:column;
      gap:10px;
      text-align:center;
    }

    #resultAvatarWrap{
      display:flex;
      justify-content:center;
      margin-top:6px;
      margin-bottom:4px;
    }
    #resultAvatar{
      width:72px;
      height:72px;
      border-radius:18px;
      object-fit:contain;
      background:#fff;
      box-shadow:0 8px 24px rgba(0,0,0,.12);
    }

    #gameoverTitle{ font-size:28px; font-weight:900; }
    #finalScore{ font-size:20px; font-weight:800; }

    .btn{
      border:none;
      border-radius:18px;
      padding:12px 14px;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
    }
    .btn.primary{ background:#111; color:#fff; }
    .btn.secondary{ background:#fff; border:1px solid #ddd; color:#111; }

    /* ✅ 只留截圖提示文字 */
    #shotHint{
      font-size:12px;
      opacity:.8;
      margin-top:2px;
      line-height:1.4;
    }

    /* Leaderboard */
    #lb{
      margin-top:10px;
      text-align:left;
      background:#fafafa;
      border-radius:18px;
      padding:12px;
      border:1px solid #eee;
    }
    #lbTitle{ font-weight:900; margin-bottom:8px; }
    .lbRow{
      display:flex;
      justify-content:space-between;
      padding:6px 8px;
      border-radius:12px;
      background:#fff;
      border:1px solid #f0f0f0;
      margin-bottom:6px;
      font-weight:700;
      font-size:14px;
    }
    .muted{ opacity:.7; font-size:12px; margin-top:4px; }
  </style>
</head>

<body>
  <div id="game">
    <div id="hud">
      <div class="pill" id="titlePill">🦒 阿鹿鹿接接樂</div>
      <div class="pill" id="welcomePill">鹿粉你好～準備接接樂！</div>

      <div class="pill small" id="stagePill">第 1 關｜莓果主題</div>

      <div class="pill small" id="scorePill">分數：<span id="score">0</span></div>
      <div class="pill small" id="lifePill">命：<span id="lives">5</span> ❤️</div>

      <div class="pill small" id="audioPill" title="音效/音樂設定">
        <button class="toggleBtn" id="btnBgmToggle">🎵 BGM：開</button>
        <button class="toggleBtn" id="btnSfxToggle">🫧 音效：開</button>
        <div class="rangeWrap">BGM <input id="bgmVol" type="range" min="0" max="100" value="22" /></div>
        <div class="rangeWrap">SFX <input id="sfxVol" type="range" min="0" max="100" value="35" /></div>
      </div>

      <button id="btnRestartTop" title="重新開始">重新開始</button>
    </div>

    <div id="player" aria-label="player">
      <img id="playerAvatar" alt="鹿鹿" />
    </div>

    <div id="ground"></div>

    <div id="gameover">
      <div id="gameoverCard">
        <div id="gameoverTitle">Game Over</div>

        <div id="resultAvatarWrap">
          <img id="resultAvatar" alt="本局鹿鹿" />
        </div>

        <div id="finalScore">分數：0</div>

        <!-- ✅ 只留截圖 -->
        <button class="btn secondary" id="btnShot">📸 結算卡一鍵截圖存相簿</button>
        <button class="btn secondary" id="btnRestart">重新開始</button>

        <div id="shotHint"></div>

        <div id="lb">
          <div id="lbTitle">🏆 排行榜（本機）</div>
          <div id="lbList"></div>
          <div class="muted">※ 目前為同裝置/同瀏覽器保存。要全體排行榜需後端（之後要我也可以幫你加）。</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LIFF_ID = "2008833499-jzAWlBAJ";

    const game = document.getElementById("game");
    const playerEl = document.getElementById("player");
    const playerAvatarEl = document.getElementById("playerAvatar");
    const resultAvatarEl = document.getElementById("resultAvatar");

    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const welcomePill = document.getElementById("welcomePill");
    const stagePillEl = document.getElementById("stagePill");

    const overlay = document.getElementById("gameover");
    const finalScoreEl = document.getElementById("finalScore");
    const gameoverCardEl = document.getElementById("gameoverCard");

    const btnRestartTop = document.getElementById("btnRestartTop");
    const btnRestart = document.getElementById("btnRestart");
    const btnShot = document.getElementById("btnShot");

    const shotHintEl = document.getElementById("shotHint");

    const btnBgmToggle = document.getElementById("btnBgmToggle");
    const btnSfxToggle = document.getElementById("btnSfxToggle");
    const bgmVolEl = document.getElementById("bgmVol");
    const sfxVolEl = document.getElementById("sfxVol");

    /**********************
     *  ✅ 可視高度（避免底部被擋）
     **********************/
    let vw = window.innerWidth;
    let vh = window.innerHeight;

    function getVisibleHeight(){
      if (window.visualViewport && typeof window.visualViewport.height === "number") {
        return window.visualViewport.height;
      }
      return window.innerHeight;
    }

    let safeBpx = 0;
    function updateSafeAreaPx(){
      const v = getComputedStyle(document.documentElement).getPropertyValue("--safeB").trim();
      const n = parseFloat(v);
      safeBpx = Number.isFinite(n) ? n : 0;
    }

    function updateViewport(){
      vw = window.innerWidth;
      vh = getVisibleHeight();
      document.documentElement.style.setProperty("--vh", `${vh * 0.01}px`);
      updateSafeAreaPx();
      setPlayerX(playerX);
    }

    window.addEventListener("resize", updateViewport);
    if (window.visualViewport){
      window.visualViewport.addEventListener("resize", updateViewport);
      window.visualViewport.addEventListener("scroll", updateViewport);
    }

    /**********************
     *  遊戲狀態
     **********************/
    let playerX = vw * 0.5;
    const playerW = 78;
    const playerH = 78;

    const itemW = 54;
    const itemH = 54;

    let score = 0;
    let lives = 5;

    let running = true;
    let lastSpawn = 0;
    let spawnInterval = 900;
    let speedBase = 220;

    const items = [];

    let playerName = "鹿粉";
    let inLIFF = false;

    // combo：只影響鑽石泡泡音高
    let combo = 0;
    let lastGoodTs = 0;

    /**********************
     *  鹿鹿頭貼：每次開局隨機（4 張）
     **********************/
    const AVATARS = [
      "assets/win-head-1.png",
      "assets/win-head-2.png",
      "assets/win-head-3.png",
      "assets/win-head-4.png",
    ];
    let currentAvatar = AVATARS[0];

    function preloadAvatars(){
      AVATARS.forEach(src => { const img = new Image(); img.src = src; });
    }

    function pickRandomAvatar(){
      let next = currentAvatar;
      if(AVATARS.length <= 1){
        next = AVATARS[0];
      }else{
        while(next === currentAvatar){
          next = AVATARS[Math.floor(Math.random() * AVATARS.length)];
        }
      }
      currentAvatar = next;
      playerAvatarEl.src = currentAvatar;
      resultAvatarEl.src = currentAvatar;
    }

    /**********************
     *  水果顏色主題輪替（關卡感）
     **********************/
    const THEMES = [
      { name:"莓果主題",  bg1:"#ffd6e7", bg2:"#fff4f9", glow:"rgba(255,120,190,.65)" },
      { name:"香蕉主題",  bg1:"#fff1b8", bg2:"#fffbe6", glow:"rgba(255,205,40,.65)" },
      { name:"葡萄主題",  bg1:"#e7d7ff", bg2:"#f6f0ff", glow:"rgba(160,110,255,.60)" },
      { name:"清爽薄荷",  bg1:"#c9fff1", bg2:"#eafffa", glow:"rgba(80,220,190,.55)" },
    ];

    let stageIndex = 0;
    let stageNum = 1;
    const STAGE_DURATION = 18;
    let stageTimer = 0;

    function applyTheme(idx){
      const t = THEMES[idx % THEMES.length];
      document.documentElement.style.setProperty("--bg1", t.bg1);
      document.documentElement.style.setProperty("--bg2", t.bg2);
      document.documentElement.style.setProperty("--themeGlow", t.glow);
      stagePillEl.textContent = `第 ${stageNum} 關｜${t.name}`;
    }
    function nextStage(){
      stageIndex = (stageIndex + 1) % THEMES.length;
      stageNum += 1;
      applyTheme(stageIndex);
    }

    function rand(min, max){ return Math.random() * (max - min) + min; }
    function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

    /**********************
     *  WebAudio：泡泡音 + 輕快休閒BGM（合成）
     **********************/
    let audioCtx = null;
    const audioState = {
      sfxOn: true,
      bgmOn: true,
      sfxVol: 0.35,
      bgmVol: 0.22,
      sfxGain: null,
      bgmGain: null,
      bgmPlaying: false,
      bgmTimer: null,
      bgmStep: 0
    };

    function ensureAudio(){
      if(audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioState.sfxGain = audioCtx.createGain();
      audioState.bgmGain = audioCtx.createGain();
      audioState.sfxGain.gain.value = audioState.sfxOn ? audioState.sfxVol : 0;
      audioState.bgmGain.gain.value = audioState.bgmOn ? audioState.bgmVol : 0;
      audioState.sfxGain.connect(audioCtx.destination);
      audioState.bgmGain.connect(audioCtx.destination);
    }
    function setSfxGain(){
      if(!audioCtx) return;
      audioState.sfxGain.gain.value = audioState.sfxOn ? audioState.sfxVol : 0;
    }
    function setBgmGain(){
      if(!audioCtx) return;
      audioState.bgmGain.gain.value = audioState.bgmOn ? audioState.bgmVol : 0;
    }

    function playPop(baseFreq){
      if(!audioState.sfxOn) return;
      ensureAudio();
      if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});

      const t = audioCtx.currentTime;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sine";
      const f0 = clamp(baseFreq, 220, 1200);
      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(f0 * 1.35, t + 0.03);
      osc.frequency.exponentialRampToValueAtTime(Math.max(120, f0 * 0.75), t + 0.12);

      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.55, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);

      osc.connect(gain);
      gain.connect(audioState.sfxGain);

      osc.start(t);
      osc.stop(t + 0.18);

      const osc2 = audioCtx.createOscillator();
      const gain2 = audioCtx.createGain();
      osc2.type = "triangle";
      osc2.frequency.setValueAtTime(f0 * 0.5, t + 0.02);
      gain2.gain.setValueAtTime(0.0001, t + 0.02);
      gain2.gain.exponentialRampToValueAtTime(0.35, t + 0.03);
      gain2.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);

      osc2.connect(gain2);
      gain2.connect(audioState.sfxGain);

      osc2.start(t + 0.02);
      osc2.stop(t + 0.14);
    }

    function playThunk(){
      if(!audioState.sfxOn) return;
      ensureAudio();
      if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});

      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "square";
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(120, t + 0.08);

      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.40, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.10);

      osc.connect(gain);
      gain.connect(audioState.sfxGain);

      osc.start(t);
      osc.stop(t + 0.12);
    }

    const bgm = {
      bpm: 128,
      melody: [64, 67, 69, 71, 72, 71, 69, 67, 64, 67, 72, 74, 72, 71, 69, 67],
      bass:   [48, 48, 48, 48, 43, 43, 43, 43, 45, 45, 45, 45, 41, 41, 41, 41],
      chord:  [60, 67, 69, 65]
    };

    function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }

    function playNote(freq, dur, type, toGain, startAt, peak=0.50){
      const t0 = startAt ?? audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);

      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(peak, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      osc.connect(g);
      g.connect(toGain);

      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }

    function scheduleBgmStep(){
      if(!audioState.bgmOn) return;
      ensureAudio();
      if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});

      const stepDur = 60 / bgm.bpm / 2;
      const step = audioState.bgmStep % 16;
      const now = audioCtx.currentTime;
      const startAt = now + 0.005;

      playNote(midiToFreq(bgm.melody[step]), stepDur * 0.85, "sine", audioState.bgmGain, startAt, 0.42);
      playNote(midiToFreq(bgm.bass[step]),   stepDur * 0.55, "triangle", audioState.bgmGain, startAt, 0.36);

      if(step % 2 === 0){
        playNote(1800, stepDur * 0.18, "square", audioState.bgmGain, startAt + 0.002, 0.12);
      }

      if(step % 4 === 0){
        const root = bgm.chord[(step/4) % 4];
        [root, root+4, root+7].forEach((mm, idx)=>{
          playNote(midiToFreq(mm), stepDur * 1.35, "sine", audioState.bgmGain, startAt + idx*0.008, 0.26);
        });
      }

      audioState.bgmStep++;
      audioState.bgmTimer = setTimeout(scheduleBgmStep, stepDur * 1000);
    }

    function startBgm(){
      if(audioState.bgmPlaying) return;
      audioState.bgmPlaying = true;
      audioState.bgmStep = 0;
      scheduleBgmStep();
    }
    function stopBgm(){
      audioState.bgmPlaying = false;
      if(audioState.bgmTimer){
        clearTimeout(audioState.bgmTimer);
        audioState.bgmTimer = null;
      }
    }

    /**********************
     *  粒子
     **********************/
    const sparks = [];

    function spawnSparks(cx, cy, type = "star"){
      const count = (type === "star") ? 7 : 12;
      const glyphs = (type === "star")
        ? ["✨","⭐️","💫"]
        : ["💥","🔥","✨","✴️"];

      for(let i=0;i<count;i++){
        const el = document.createElement("div");
        el.className = "spark";
        el.textContent = glyphs[Math.floor(rand(0, glyphs.length))];

        const ang = (type === "star")
          ? rand(-Math.PI*0.95, -Math.PI*0.05)
          : rand(0, Math.PI*2);

        const spd = (type === "star") ? rand(140, 320) : rand(220, 520);
        const vx = Math.cos(ang) * spd;
        const vy = Math.sin(ang) * spd;

        const rot = rand(-180, 180);
        const vr  = rand(-520, 520);

        const x = cx + rand(-10, 10);
        const y = cy + rand(-8, 8);

        el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
        game.appendChild(el);

        sparks.push({
          el, x, y, vx, vy,
          life: (type === "star") ? rand(0.45, 0.75) : rand(0.25, 0.55),
          rot, vr,
          opacity: 1,
          type
        });
      }
    }

    function updateSparks(dt){
      for(let i=sparks.length-1;i>=0;i--){
        const p = sparks[i];
        p.life -= dt;

        if(p.life <= 0){
          if(p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);
          sparks.splice(i,1);
          continue;
        }

        const g = (p.type === "star") ? 760 : 980;
        const dampX = (p.type === "star") ? 0.6 : 1.2;
        const dampY = (p.type === "star") ? 0.2 : 0.8;

        p.vy += g * dt;
        p.vx *= (1 - dampX*dt);
        p.vy *= (1 - dampY*dt);

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot += p.vr * dt;

        const maxLife = (p.type === "star") ? 0.75 : 0.55;
        p.opacity = Math.max(0, p.life / maxLife);

        p.el.style.opacity = String(p.opacity);
        p.el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${p.rot}deg) scale(${0.9 + (1-p.opacity)*0.25})`;
      }
    }

    /**********************
     *  物品機率：鑽石 25%、炸彈 25%、水果自動平衡（剩 50% 平均）
     **********************/
    function spawnItem(){
      const el = document.createElement("div");
      el.className = "item";

      const pDiamond = 0.25;
      const pBomb = 0.25;
      const r = Math.random();

      let kind = "";
      if(r < pDiamond){
        kind = "diamond";
      }else if(r < pDiamond + pBomb){
        kind = "bomb";
      }else{
        const others = ["apple","banana","grape"];
        kind = others[Math.floor(Math.random() * others.length)];
        el.classList.add("fruit");
      }

      const iconMap = {
        diamond: "💎",
        bomb: "💣",
        apple: "🍎",
        banana: "🍌",
        grape: "🍇",
      };
      el.textContent = iconMap[kind];

      const x = rand(12, vw - itemW - 12);
      const y = -60;
      el.style.transform = `translate(${x}px, ${y}px)`;
      game.appendChild(el);

      const speed = speedBase + rand(-30, 90);
      items.push({ el, x, y, speed, kind });
    }

    function intersects(ax, ay, aw, ah, bx, by, bw, bh){
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function updateHUD(){
      scoreEl.textContent = String(score);
      livesEl.textContent = String(lives);
    }

    /**********************
     *  排行榜（本機）
     **********************/
    const LB_KEY = "alulu_catch_lb_v1";

    function loadLeaderboard(){
      try{
        const raw = localStorage.getItem(LB_KEY);
        return raw ? JSON.parse(raw) : [];
      }catch(e){ return []; }
    }
    function saveLeaderboard(list){
      localStorage.setItem(LB_KEY, JSON.stringify(list));
    }
    function addToLeaderboard(name, score){
      const list = loadLeaderboard();
      list.push({ name, score, ts: Date.now() });
      list.sort((a,b)=> b.score - a.score);
      const top = list.slice(0, 10);
      saveLeaderboard(top);
      return top;
    }
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
      }[m]));
    }
    function renderLeaderboard(list){
      const box = document.getElementById("lbList");
      box.innerHTML = "";
      if(!list.length){
        box.innerHTML = `<div class="muted">還沒有紀錄，快當第一名！</div>`;
        return;
      }
      list.forEach((r, i)=>{
        const row = document.createElement("div");
        row.className = "lbRow";
        const crown = (i === 0) ? "👑 " : "";
        row.innerHTML = `<div>${crown}${i+1}. ${escapeHtml(r.name || "鹿粉")}</div><div>${r.score}</div>`;
        box.appendChild(row);
      });
    }

    /**********************
     *  LIFF 初始化（僅抓名字）
     **********************/
    async function initLIFF(){
      try{
        await liff.init({ liffId: LIFF_ID });
        inLIFF = true;

        if (!liff.isLoggedIn()) {
          // 不強制登入，不影響遊玩
          return;
        }

        try{
          const profile = await liff.getProfile();
          if(profile && profile.displayName){
            playerName = profile.displayName;
            welcomePill.textContent = `鹿粉 ${playerName}～準備接接樂！`;
          }
        }catch(e){
          welcomePill.textContent = "鹿粉你好～準備接接樂！";
        }
      }catch(e){
        inLIFF = false;
        welcomePill.textContent = "鹿粉你好～準備接接樂！";
      }
    }

    /**********************
     *  ✅ 純截圖：不分享、不送出
     *  目標：跳出 iOS 存圖介面 → 使用者點「儲存到照片」
     **********************/
    async function captureResultCard(){
      if(typeof html2canvas !== "function"){
        shotHintEl.textContent = "截圖工具載入失敗（html2canvas 未載入）。";
        return;
      }

      try{
        const canvas = await html2canvas(gameoverCardEl, {
          backgroundColor: "#ffffff",
          scale: 2,
          useCORS: true
        });

        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png", 1.0));
        if(!blob){
          shotHintEl.textContent = "截圖失敗（無法輸出圖片）。";
          return;
        }

        const fileName = `alulu-score-${Date.now()}.png`;
        const file = new File([blob], fileName, { type:"image/png" });

        // ✅ 使用 share sheet 只用來「存到照片」流程（不帶文字/標題，不做分享文字）
        if(navigator.canShare && navigator.canShare({ files:[file] })){
          try{
            await navigator.share({ files:[file] });
            shotHintEl.textContent = "已開啟存圖介面：請選「儲存到照片」即可存入相簿 ✅";
            return;
          }catch(e){
            // 使用者取消/不支援：走備援
          }
        }

        // ✅ 備援：顯示圖片 + 下載（iPhone 可長按存相簿）
        const url = URL.createObjectURL(blob);
        shotHintEl.innerHTML = `
          <div style="margin-top:8px; display:flex; flex-direction:column; gap:8px; align-items:center;">
            <img src="${url}" alt="結算卡截圖" style="width:min(320px, 80vw); border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.12);" />
            <a href="${url}" download="${fileName}" style="font-weight:900; text-decoration:none;">⬇️ 下載截圖</a>
            <div style="font-size:12px; opacity:.75;">（iPhone：長按圖片 → 加到照片 / 儲存到相簿）</div>
          </div>
        `;
      }catch(e){
        shotHintEl.textContent = "截圖失敗：請再試一次。";
      }
    }

    /**********************
     *  玩家控制（取消跳動；只左右移動）
     **********************/
    let dragging = false;
    let dragOffsetX = 0;

    function setPlayerX(x){
      playerX = clamp(x, playerW/2 + 6, vw - playerW/2 - 6);
      playerEl.style.transform = `translateX(${playerX - vw/2}px)`;
    }

    function pointerDown(e){
      ensureAudio();
      if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
      if(audioState.bgmOn) startBgm();

      dragging = true;
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      dragOffsetX = cx - playerX;
    }
    function pointerMove(e){
      if(!dragging) return;
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      setPlayerX(cx - dragOffsetX);
    }
    function pointerUp(){ dragging = false; }

    game.addEventListener("mousedown", pointerDown, {passive:false});
    window.addEventListener("mousemove", pointerMove, {passive:false});
    window.addEventListener("mouseup", pointerUp, {passive:false});

    game.addEventListener("touchstart", pointerDown, {passive:false});
    window.addEventListener("touchmove", pointerMove, {passive:false});
    window.addEventListener("touchend", pointerUp, {passive:false});
    window.addEventListener("touchcancel", pointerUp, {passive:false});

    /**********************
     *  音效 UI
     **********************/
    function refreshAudioUi(){
      btnBgmToggle.textContent = audioState.bgmOn ? "🎵 BGM：開" : "🎵 BGM：關";
      btnSfxToggle.textContent = audioState.sfxOn ? "🫧 音效：開" : "🫧 音效：關";
    }

    btnBgmToggle.addEventListener("click", ()=>{
      audioState.bgmOn = !audioState.bgmOn;
      ensureAudio();
      setBgmGain();
      if(audioState.bgmOn) startBgm();
      else stopBgm();
      refreshAudioUi();
    });

    btnSfxToggle.addEventListener("click", ()=>{
      audioState.sfxOn = !audioState.sfxOn;
      ensureAudio();
      setSfxGain();
      refreshAudioUi();
      if(audioState.sfxOn) playPop(420);
    });

    bgmVolEl.addEventListener("input", ()=>{
      audioState.bgmVol = Number(bgmVolEl.value) / 100;
      ensureAudio();
      setBgmGain();
    });
    sfxVolEl.addEventListener("input", ()=>{
      audioState.sfxVol = Number(sfxVolEl.value) / 100;
      ensureAudio();
      setSfxGain();
    });

    /**********************
     *  接到事件：鑽石星星 / 炸彈爆炸（不影響座標）
     **********************/
    function onCatchDiamond(px, py){
      const now = performance.now();
      if(now - lastGoodTs < 1100) combo += 1;
      else combo = 1;
      lastGoodTs = now;

      const freq = 360 + Math.min(18, combo) * 28;
      playPop(freq);
      spawnSparks(px + playerW/2, py + 18, "star");
    }
    function onCatchBomb(px, py){
      combo = 0;
      playThunk();
      spawnSparks(px + playerW/2, py + 18, "boom");
    }
    function onCatchFruit(){
      combo = 0;
      playPop(460);
    }

    /**********************
     *  遊戲流程
     **********************/
    function removeItem(i){
      const it = items[i];
      if(it && it.el && it.el.parentNode) it.el.parentNode.removeChild(it.el);
      items.splice(i,1);
    }

    function gameOver(){
      running = false;

      finalScoreEl.textContent = `分數：${score}`;
      shotHintEl.textContent = "";

      const list = addToLeaderboard(playerName, score);
      renderLeaderboard(list);

      overlay.style.display = "flex";
    }

    function resetGame(){
      for(let i=items.length-1;i>=0;i--) removeItem(i);
      for(let i=sparks.length-1;i>=0;i--){
        const p = sparks[i];
        if(p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el);
        sparks.splice(i,1);
      }

      score = 0;
      lives = 5;
      combo = 0;
      lastGoodTs = 0;

      spawnInterval = 900;
      speedBase = 220;
      lastSpawn = 0;

      stageIndex = 0;
      stageNum = 1;
      stageTimer = 0;
      applyTheme(stageIndex);

      pickRandomAvatar();

      running = true;
      overlay.style.display = "none";
      updateHUD();

      updateViewport();
      setPlayerX(vw * 0.5);
    }

    function tick(ts){
      if(!tick.last) tick.last = ts;
      const dt = (ts - tick.last) / 1000;
      tick.last = ts;

      updateSparks(dt);

      if(running){
        stageTimer += dt;
        if(stageTimer >= STAGE_DURATION){
          stageTimer = 0;
          nextStage();
        }

        if(ts - lastSpawn > spawnInterval){
          spawnItem();
          lastSpawn = ts;
          spawnInterval = Math.max(380, spawnInterval - 10);
          speedBase = Math.min(520, speedBase + 2.2);
        }

        const px = playerX - playerW/2;
        const py = vh - (22 + safeBpx) - playerH;
        const groundY = vh - 18 - safeBpx;

        for(let i=items.length-1;i>=0;i--){
          const it = items[i];
          it.y += it.speed * dt;

          // ✅ 沒接到：只有水果才扣命；鑽石/炸彈沒接到不扣命
          if(it.y > groundY - itemH/2){
            const isFruit = (it.kind === "apple" || it.kind === "banana" || it.kind === "grape");
            if(isFruit){
              lives -= 1;
              updateHUD();
              if(lives <= 0){
                removeItem(i);
                gameOver();
                break;
              }
            }
            removeItem(i);
            continue;
          }

          // ✅ 接到才加減分
          if(intersects(px, py, playerW, playerH, it.x, it.y, itemW, itemH)){
            if(it.kind === "diamond"){
              score += 10;
              onCatchDiamond(px, py);
            }else if(it.kind === "bomb"){
              score = Math.max(0, score - 10);
              onCatchBomb(px, py);
            }else{
              if(it.kind === "apple")  score += 2;
              if(it.kind === "banana") score += 4;
              if(it.kind === "grape")  score += 3;
              onCatchFruit();
            }

            updateHUD();
            removeItem(i);
            continue;
          }

          it.el.style.transform = `translate(${it.x}px, ${it.y}px)`;
        }
      }

      requestAnimationFrame(tick);
    }

    /**********************
     *  按鈕
     **********************/
    btnRestartTop.addEventListener("click", resetGame);
    btnRestart.addEventListener("click", resetGame);
    btnShot.addEventListener("click", captureResultCard);

    /**********************
     *  Init
     **********************/
    (async function boot(){
      updateViewport();
      preloadAvatars();
      pickRandomAvatar();

      applyTheme(stageIndex);
      renderLeaderboard(loadLeaderboard());

      setPlayerX(playerX);

      initLIFF();
      updateHUD();
      refreshAudioUi();

      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
